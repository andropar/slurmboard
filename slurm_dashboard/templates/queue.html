<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slurmboard</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const stored = localStorage.getItem("theme");
        const theme = ["light", "dark"].includes(param) ? param
          : ["light", "dark"].includes(stored) ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/queue.css') }}">
</head>
<body>
<header class="topbar">
  <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="5" rx="1"/><rect x="3" y="15" width="18" height="5" rx="1"/><path d="M7 6.5h.01M7 17.5h.01M12 9v6"/></svg></span>
  <span class="brand">slurmboard</span><span class="divider"></span><span class="cluster muted" id="updated">Loading…</span>
  <span class="spacer"></span><a class="advanced-link" href="{{ url_for('advanced') }}">Advanced tools</a>
  <button id="refresh">Refresh</button>
  <button class="icon-button" id="theme" aria-label="Toggle light and dark theme" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button>
</header>
<main>
  <p id="queue-error" class="queue-error" role="alert" hidden></p>
  <section class="workspace" aria-label="Job queue">
    <div class="toolbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" aria-label="Search jobs" placeholder="Search by job ID or name…" autocomplete="off"></label>
      <label>History <select id="history" aria-label="Accounting history window"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label>
      <label>Queued from <input id="date-from" type="date" aria-label="Queued from date (UTC)"></label>
      <label>to <input id="date-to" type="date" aria-label="Queued to date (UTC)"></label>
      <div class="sort-controls">
        <label>Sort <select id="mobile-sort" aria-label="Sort jobs by column"><option value="id">Job ID</option><option value="name">Job name</option><option value="status">Status</option><option value="queued">Queued</option><option value="started">Started</option><option value="ended">Ended</option></select></label>
        <button id="sort-direction" aria-label="Change sort direction">Descending ↓</button>
      </div>
      <span class="toolbar-note">All times UTC · full names always visible</span>
    </div>
    <nav class="filters" aria-label="Filter jobs by status" id="filters"></nav>
    <div class="table-scroll" tabindex="0" role="region" aria-label="Jobs table, scroll for more jobs">
      <table>
        <colgroup><col class="id"><col class="name"><col class="state"><col class="timestamp"><col class="timestamp"><col class="timestamp"><col class="actions"></colgroup>
        <thead><tr>
          <th scope="col" aria-sort="descending"><button data-sort="id">Job ID ↓</button></th>
          <th scope="col"><button data-sort="name">Job name</button></th>
          <th scope="col"><button data-sort="status">Status</button></th>
          <th scope="col"><button data-sort="queued">Queued</button></th>
          <th scope="col"><button data-sort="started">Started</button></th>
          <th scope="col"><button data-sort="ended">Ended</button></th>
          <th scope="col">Script &amp; logs</th>
        </tr></thead>
        <tbody id="jobs"></tbody>
      </table>
      <div class="empty" id="empty"><span id="empty-text">Loading jobs…</span> <button id="clear">Clear filters</button></div>
    </div>
    <footer class="table-footer">
      <span id="results" role="status" aria-live="polite"></span>
      <nav class="pagination" aria-label="Job pagination">
        <label>Rows per page <select id="page-size"><option>10</option><option>25</option><option>50</option><option selected>100</option></select></label>
        <button id="first-page" aria-label="First page">First</button>
        <button id="previous-page" aria-label="Previous page">Previous</button>
        <span id="page-status" aria-live="polite"></span>
        <button id="next-page" aria-label="Next page">Next</button>
        <button id="last-page" aria-label="Last page">Last</button>
      </nav>
    </footer>
  </section>
  <section class="viewer" id="viewer" hidden aria-labelledby="viewer-title">
    <div class="viewer-header">
      <div><div class="viewer-eyebrow" id="viewer-id"></div><h2 id="viewer-title"></h2></div>
      <button id="close" class="icon-button" aria-label="Close job viewer" title="Close (Escape)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <div class="viewer-tabs">
      <div role="tablist" aria-label="Job files">
        <button id="tab-script" role="tab" data-file="script" aria-controls="file-content" aria-selected="true">Submitted script</button>
        <button id="tab-stdout" role="tab" data-file="stdout" aria-controls="file-content" aria-selected="false">Stdout</button>
        <button id="tab-stderr" role="tab" data-file="stderr" aria-controls="file-content" aria-selected="false">Stderr</button>
      </div>
      <span class="file-note" id="file-note"></span>
      <button id="follow" aria-pressed="true" hidden>Follow output</button>
      <button id="retry-file" hidden>Retry</button>
    </div>
    <div class="viewer-message" id="viewer-message" role="status"></div>
    <pre id="file-content" role="tabpanel" aria-labelledby="tab-script" tabindex="0"></pre>
  </section>
  <div class="page-note"><span><span id="scope">Loading job sources…</span> · — means unavailable or not applicable</span><span><span class="kbd">/</span> Search &nbsp; <span class="kbd">Esc</span> Close viewer</span></div>
</main>
<script src="{{ url_for('static', filename='js/queue.js') }}" defer></script>
</body>
</html>
