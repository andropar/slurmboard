<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Slurm Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1d1a'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='14.5' width='12' height='3' rx='1.5' fill='%235b7cf0'/%3E%3Crect x='7' y='20' width='15' height='3' rx='1.5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            var saved = null;
            try { saved = JSON.parse(localStorage.getItem('slurmdash.theme')); } catch (e) {}
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}">
</head>
<body>
    <header class="top">
        <div class="brand">
            <span class="wordmark">Slurm Dashboard</span>
            <span class="host" title="Host running the dashboard, and whose jobs are shown">{{ settings.host }} · {{ 'all users' if settings.all_users else settings.user }}</span>
        </div>
        <nav class="views seg" aria-label="Views">
            <button data-view="jobs" class="on">Jobs</button>
            <button data-view="timeline">Timeline</button>
            <button data-view="pipelines">Pipelines</button>
            <button data-view="insights">Insights</button>
        </nav>
        <div class="top-right">
            <span class="live" id="live" title="Waiting for the first update"><i></i><span>Connecting</span></span>
            <button class="icon-btn" data-action="help" title="Shortcuts and search syntax (?)" aria-label="Shortcuts and search syntax">?</button>
            <button class="icon-btn" data-action="theme" title="Switch between light and dark" aria-label="Switch between light and dark">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
            </button>
            <button class="btn primary" data-action="submit" title="Submit a job (n)">Submit job</button>
        </div>
    </header>
    <div class="banner" id="banner" role="status" hidden></div>

    <main>
        <section class="view jobs" id="view-jobs">
            <div class="list-pane">
                <div class="list-tools">
                    <input type="search" id="q" placeholder="Search jobs" aria-label="Search jobs" spellcheck="false" autocomplete="off">
                    <div class="chips" id="chips" role="group" aria-label="Filter by state"></div>
                </div>
                <div class="list" id="list" role="listbox" aria-label="Jobs"></div>
                <div class="batch" id="batch" hidden></div>
            </div>
            <div class="detail-pane" id="detail"></div>
        </section>
        <section class="view page" id="view-timeline" hidden></section>
        <section class="view page" id="view-pipelines" hidden></section>
        <section class="view page" id="view-insights" hidden></section>
    </main>

    <noscript><p style="padding:24px">Slurm Dashboard needs JavaScript.</p></noscript>
    <script>window.SETTINGS = {{ settings | tojson }};</script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v={{ version }}"></script>
</body>
</html>
